name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetClient.csproj

      - name: Build (Release, x64)
        run: dotnet build NetClient.csproj -c Release -p:Platform=x64 --no-restore

      - name: Locate output
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse bin\ -Filter *.exe |
                 Where-Object { $_.FullName -notmatch '\\ref\\' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "exe not found"; exit 1 }
          Write-Host "Found: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compute SHA256
        shell: pwsh
        run: |
          $h = Get-FileHash "${{ steps.find.outputs.path }}" -Algorithm SHA256
          Write-Host "SHA256: $($h.Hash)"
          "$($h.Hash)  ${{ steps.find.outputs.name }}" |
              Out-File -FilePath SHA256.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetClient-x64
          path: |
            ${{ steps.find.outputs.path }}
            SHA256.txt
          if-no-files-found: error
          retention-days: 30
