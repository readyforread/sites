name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MyApp.csproj

      - name: Build (Release, x64)
        run: dotnet build MyApp.csproj -c Release -p:Platform=x64 --no-restore

      - name: Show output
        run: Get-ChildItem -Recurse bin\ -Filter *.exe | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-x64
          path: bin/x64/Release/net48/MyApp.exe
          if-no-files-found: error
          retention-days: 30
